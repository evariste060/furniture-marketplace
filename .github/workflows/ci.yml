name: Foundation checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci_owner
          POSTGRES_PASSWORD: ci_owner_password
          POSTGRES_DB: rwanda_ecommerce_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_owner -d rwanda_ecommerce_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 12
    env:
      # Throwaway CI-only credentials for the disposable service containers above.
      TEST_DATABASE_URL: postgresql+psycopg://ci_owner:ci_owner_password@127.0.0.1:5432/rwanda_ecommerce_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Unit and SQLite integration tests
        run: uv run pytest -q --ignore=tests/postgres
      - name: PostgreSQL + Redis + real HTTP tests
        run: uv run pytest -q tests/postgres
      - run: uv run ruff check . ../scripts
      - run: uv run ruff format --check . ../scripts
      - name: Type check (required since 2026-10-26)
        run: uv run mypy
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
