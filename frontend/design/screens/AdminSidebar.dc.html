<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin sidebar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../tokens-and-components.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<aside class="ts col" style="width: 100%; min-height: 1100px; background: #071F42; color: #fff; gap: 0; font-family: Inter, system-ui, sans-serif">
  <div class="col" style="gap: 6px; padding: 18px 20px 16px">
    <a href="Dashboard.dc.html" style="display: block; background: #fff; border-radius: 8px; padding: 4px 8px; width: 150px" aria-label="3 Sixty Technologies admin — dashboard"><img src="../assets/3sixty-logo.jpeg" alt="3 Sixty Technologies" style="width: 100%; display: block; mix-blend-mode: multiply"></a>
    <span class="t-cap" style="color: #A9BCD6">Admin Panel</span>
  </div>
  <nav aria-label="Admin" class="col" style="gap: 14px; padding: 4px 12px 16px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
      <div class="col" style="gap: 2px">
        <span class="t-over" style="color: #A9BCD6; padding: 0 12px 4px; font-size: 11px">{{g.title}}</span>
        <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
          <a class="{{it.cls}}" href="{{it.href}}"><span class="ic {{it.icon}} i18" aria-hidden="true"></span><span class="grow">{{it.label}}</span><sc-if value="{{it.hasCount}}" hint-placeholder-val="{{ false }}"><span class="count" style="background: #DC2626">{{it.count}}</span></sc-if></a>
        </sc-for>
      </div>
    </sc-for>
  </nav>
  <span class="grow"></span>
  <div class="row" style="gap: 10px; padding: 14px 20px; border-top: 1px solid rgba(255,255,255,.12)">
    <span class="avatar">EN</span>
    <span class="col grow" style="gap: 0"><b class="t-sm fw5">Evariste N.</b><span class="t-cap" style="color: #A9BCD6">{{role}}</span></span>
    <a href="Login.dc.html" aria-label="Log out" style="color: #A9BCD6; display: flex"><span class="ic ic-logout i18" aria-hidden="true"></span></a>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["Dashboard","Orders","Payments","Products","Categories & Brands","Catalogue Import","Inventory","Reviews","Delivery Zones","Promotions","Analytics","Reports","Staff & Roles","Notifications","Settings & Pages","Audit Log"],"default":"Dashboard"},"role":{"editor":"text","default":"Administrator"},"$preview":{"width":240,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'Dashboard';
    const G = [
      ['Overview', [['Dashboard', 'ic-home', 'Dashboard.dc.html']]],
      ['Orders', [['Orders', 'ic-cart', 'Orders.dc.html', 8], ['Payments', 'ic-card', 'Payments.dc.html']]],
      ['Catalogue', [['Products', 'ic-package', 'Products.dc.html'], ['Categories & Brands', 'ic-layers', 'Categories.dc.html'], ['Catalogue Import', 'ic-upload', 'Import.dc.html'], ['Inventory', 'ic-box', 'Inventory.dc.html'], ['Reviews', 'ic-chat', 'Reviews.dc.html', 5]]],
      ['Store', [['Delivery Zones', 'ic-pin', 'Delivery.dc.html'], ['Promotions', 'ic-tag', 'Promotions.dc.html']]],
      ['Reports', [['Analytics', 'ic-pie', 'Analytics.dc.html'], ['Reports', 'ic-chart', 'Reports.dc.html']]],
      ['System', [['Staff & Roles', 'ic-users', 'Staff.dc.html'], ['Notifications', 'ic-bell', 'Notifications.dc.html'], ['Settings & Pages', 'ic-settings', 'Settings.dc.html'], ['Audit Log', 'ic-history', 'Audit.dc.html']]]
    ];
    const groups = G.map(([title, items]) => ({ title, items: items.map(([label, icon, href, count]) => ({ label, icon, href, count: String(count || ''), hasCount: !!count, cls: label === active ? 'sideitem on' : 'sideitem' })) }));
    return { groups, role: this.props.role ?? 'Administrator' };
  }
}
</script>
</body>
</html>
