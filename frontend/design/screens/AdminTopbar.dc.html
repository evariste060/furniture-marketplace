<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin top bar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../tokens-and-components.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<header class="ts row wrapx" style="width: 100%; min-height: 68px; padding: 12px 28px; gap: 20px; background: #fff; border-bottom: 1px solid #E2E8F0; font-family: Inter, system-ui, sans-serif; color: #0F172A">
  <label class="row" style="gap: 10px; height: 42px; padding: 0 14px; border-radius: 8px; background: #F5F8FC; flex: 1 1 280px; max-width: 560px; color: #64748B">
    <span class="ic ic-search i18" aria-hidden="true"></span>
    <input aria-label="Search the admin" placeholder="Search orders, products, customers…" style="border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; font-size: 13px">
    <span class="t-cap" style="padding: 2px 6px; border-radius: 4px; border: 1px solid #E2E8F0; background: #fff">Ctrl + K</span>
  </label>
  <span class="grow"></span>
  <button type="button" class="row" style="gap: 6px; border: 0; background: transparent; font-size: 13px; font-weight: 500; color: #0F172A; padding: 0" aria-label="Language: English">EN<span class="ic ic-chev-d i14 c-mut" aria-hidden="true"></span></button>
  <a href="Notifications.dc.html" aria-label="Notifications, 3 new" style="position: relative; display: flex; color: #475569"><span class="ic ic-bell i22" aria-hidden="true"></span><span class="count" style="position: absolute; top: -6px; right: -8px; background: #DC2626">3</span></a>
  <div class="row" style="gap: 10px"><span class="avatar" style="width: 38px; height: 38px">EN</span><span class="col" style="gap: 0"><b class="t-sm fw5">Evariste N.</b><span class="t-cap c-mut">{{role}}</span></span><span class="ic ic-chev-d i16 c-mut" aria-hidden="true"></span></div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"text","default":"Administrator"},"$preview":{"width":1200,"height":68}}'>
class Component extends DCLogic {
  renderVals() { return { role: this.props.role ?? 'Administrator' }; }
}
</script>
</body>
</html>
