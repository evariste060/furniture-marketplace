<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin — Delivery zones</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../tokens-and-components.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="ts adm" style="width: 100%; font-family: Inter, system-ui, sans-serif; color: #0F172A">
  <div class="adm-side" style="background: #071F42"><dc-import name="AdminSidebar" active="Delivery Zones" hint-size="240px,1120px"></dc-import></div>
  <div class="adm-main">
    <dc-import name="AdminTopbar" hint-size="100%,68px"></dc-import>
    <main class="adm-body">
      <div class="row between wrapx" style="gap: 12px; align-items: flex-end">
        <div class="col" style="gap: 2px"><nav class="crumb" aria-label="Breadcrumb"><a href="Dashboard.dc.html" style="color: #64748B">Dashboard</a><span aria-hidden="true">/</span><b>Delivery zones</b></nav><h1 class="t-h1">Delivery zones</h1></div>
        <button type="button" class="btn btn-p btn-sm"><span class="ic ic-plus i16" aria-hidden="true"></span>Add zone</button>
      </div>
      <section class="card p20 row wrapx" style="gap: 20px; align-items: flex-end">
        <div class="field" style="width: 260px"><label class="lbl" for="ft">Free delivery threshold (Kigali)</label><div class="prefix"><span>RWF</span><input id="ft" defaultValue="50,000"></div></div>
        <div class="field" style="width: 220px"><label class="lbl" for="cod">Cash on delivery</label><select id="cod" class="inp"><option>Kigali zones only</option><option>All zones</option><option>Off</option></select></div>
        <div class="field" style="width: 240px"><label class="lbl" for="pick">Store pickup</label><select id="pick" class="inp"><option>On · KN 5 Ave, Kigali</option></select></div>
        <button type="button" class="btn btn-s">Save settings</button>
      </section>
      <section class="card" style="overflow: hidden">
        <div class="scrollx"><table class="tbl"><thead><tr><th scope="col">Zone</th><th scope="col">Districts</th><th scope="col">Fee</th><th scope="col">Free over threshold</th><th scope="col">Delivery time</th><th scope="col">Orders (30 days)</th><th scope="col">Active</th><th scope="col"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Actions</span></th></tr></thead><tbody>
          <sc-for list="{{zones}}" as="z" hint-placeholder-count="6"><tr><td class="fw5">{{z.n}}</td><td class="c-tx2">{{z.d}}</td><td class="fw5">{{z.f}}</td><td><span class="badge {{z.fc}}">{{z.free}}</span></td><td class="c-tx2">{{z.t}}</td><td>{{z.o}}</td><td><span class="toggle {{z.tc}}" role="switch" aria-checked="{{z.on}}" aria-label="{{z.n}} active"></span></td><td><button type="button" class="icbtn" aria-label="Edit {{z.n}}" style="width: 30px; height: 30px; border: 0"><span class="ic ic-edit i14" aria-hidden="true"></span></button></td></tr></sc-for>
        </tbody></table></div>
      </section>
      <p class="t-sm c-mut row" style="gap: 6px"><span class="ic ic-info i16" aria-hidden="true"></span>Addresses outside every active zone see a message at checkout with your contact details and the store pickup option.</p>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const z = (n, d, f, free, t, o, on) => ({ n, d, f, free: free ? 'Yes' : 'No', fc: free ? 's-ok' : 's-neu', t, o: String(o), on: on ? 'true' : 'false', tc: on ? 'on' : '' });
    return { zones: [
      z('Kigali — Gasabo', 'Gasabo', 'RWF 2,000', true, '1–2 days', 61, true),
      z('Kigali — Kicukiro', 'Kicukiro', 'RWF 2,000', true, '1–2 days', 38, true),
      z('Kigali — Nyarugenge', 'Nyarugenge', 'RWF 2,000', true, '1–2 days', 27, true),
      z('Eastern Province', 'Rwamagana, Kayonza, Bugesera +4', 'RWF 4,000', false, '2–3 days', 9, true),
      z('Southern Province', 'Huye, Muhanga, Nyanza +5', 'RWF 5,000', false, '2–4 days', 6, true),
      z('Western Province', 'Rubavu, Karongi, Rusizi +4', 'RWF 5,000', false, '3–4 days', 4, true),
      z('Northern Province', 'Musanze, Gicumbi +3', 'RWF 4,500', false, '2–3 days', 0, false)
    ] };
  }
}
</script>
</body>
</html>
