<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile — Cart</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../tokens-and-components.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="ts" style="position: relative; width: 390px; height: 1500px; overflow: hidden; background: #F5F8FC; font-family: Inter, system-ui, sans-serif; color: #0F172A">
  <header class="row" style="height: 56px; padding: 0 12px; gap: 6px; background: #fff; border-bottom: 1px solid #E2E8F0"><a href="MobileProduct.dc.html" class="icbtn" aria-label="Back" style="border: 0"><span class="ic ic-arrow-l i22" aria-hidden="true"></span></a><h1 class="t-h3">Cart (2)</h1></header>
  <div class="row r8 t-sm" style="gap: 8px; margin: 12px 16px 0; padding: 10px 12px; background: #DCFCE7; color: #15803D"><span class="ic ic-truck i16" aria-hidden="true"></span>You qualify for free delivery in Kigali</div>
  <div class="col" style="gap: 12px; padding: 12px 16px">
    <div class="card row" style="gap: 12px; padding: 12px; align-items: flex-start">
      <span class="imgbox" style="width: 80px; height: 80px"><span class="dev dev-ph-violet" aria-hidden="true" style="width: 66px; height: 66px"></span></span>
      <span class="col grow" style="gap: 4px"><b class="t-sm fw6">Samsung Galaxy A55 5G</b><span class="t-cap c-mut">Awesome Navy · 128GB</span><b class="fw6">RWF 520,000</b>
        <span class="row between"><span class="row" style="gap: 0; border: 1px solid #E2E8F0; border-radius: 8px; height: 34px; overflow: hidden"><button type="button" aria-label="Decrease" style="width: 34px; height: 100%; border: 0; background: #fff; display: flex; align-items: center; justify-content: center; color: #475569"><span class="ic ic-minus i14" aria-hidden="true"></span></button><span class="fw6" style="width: 32px; text-align: center; line-height: 32px">1</span><button type="button" aria-label="Increase" style="width: 34px; height: 100%; border: 0; background: #fff; display: flex; align-items: center; justify-content: center; color: #475569"><span class="ic ic-plus i14" aria-hidden="true"></span></button></span><button type="button" class="icbtn" aria-label="Remove" style="border: 0; color: #DC2626"><span class="ic ic-trash i18" aria-hidden="true"></span></button></span>
      </span>
    </div>
    <div class="card row" style="gap: 12px; padding: 12px; align-items: flex-start">
      <span class="imgbox" style="width: 80px; height: 80px"><span class="dev dev-buds" aria-hidden="true" style="width: 66px; height: 66px"></span></span>
      <span class="col grow" style="gap: 4px"><b class="t-sm fw6">Samsung Galaxy Buds2 Pro</b><span class="t-cap c-mut">Bora Purple</span><b class="fw6">RWF 245,000</b>
        <span class="row between"><span class="row" style="gap: 0; border: 1px solid #E2E8F0; border-radius: 8px; height: 34px; overflow: hidden"><button type="button" aria-label="Decrease" style="width: 34px; height: 100%; border: 0; background: #fff; display: flex; align-items: center; justify-content: center; color: #475569"><span class="ic ic-minus i14" aria-hidden="true"></span></button><span class="fw6" style="width: 32px; text-align: center; line-height: 32px">1</span><button type="button" aria-label="Increase" style="width: 34px; height: 100%; border: 0; background: #fff; display: flex; align-items: center; justify-content: center; color: #475569"><span class="ic ic-plus i14" aria-hidden="true"></span></button></span><button type="button" class="icbtn" aria-label="Remove" style="border: 0; color: #DC2626"><span class="ic ic-trash i18" aria-hidden="true"></span></button></span>
      </span>
    </div>
    <div class="card p16 col" style="gap: 8px"><label class="lbl" for="mc">Discount code</label><div class="row" style="gap: 8px"><input id="mc" class="inp grow" placeholder="Enter code"><button type="button" class="btn btn-s">Apply</button></div></div>
    <div class="card p16 col" style="gap: 10px">
      <div class="kv"><span>Subtotal (2 items)</span><b class="fw5">RWF 765,000</b></div>
      <div class="kv"><span>Delivery</span><span class="c-mut">At checkout</span></div>
      <hr class="hr">
      <div class="row between"><b class="t-h4">Total</b><b class="t-price" style="color: #0D2D52">RWF 765,000</b></div>
    </div>
    <h2 class="t-h4" style="padding-top: 8px">Frequently bought together</h2>
    <div class="g g2" style="gap: 12px"><sc-for list="{{recs}}" as="it" hint-placeholder-count="2"><dc-import name="ProductCard" p="{{it}}" hint-size="100%,330px"></dc-import></sc-for></div>
  </div>
  <div class="col" style="position: absolute; left: 0; right: 0; bottom: 0; gap: 6px; padding: 12px 16px 16px; background: #fff; border-top: 1px solid #E2E8F0">
    <div class="row between t-sm"><span class="c-tx2">Total</span><b class="fw7">RWF 765,000</b></div>
    <a class="btn btn-p btn-block" href="MobileCheckout.dc.html">Proceed to Checkout<span class="ic ic-arrow-r i16" aria-hidden="true"></span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    return { recs: [
      { name: 'Samsung 25W Fast Charger', price: 'RWF 25,000', img: 'dev-power' },
      { name: 'Galaxy A55 Clear Case', price: 'RWF 15,000', img: 'dev-ph-lilac' }
    ] };
  }
}
</script>
</body>
</html>
