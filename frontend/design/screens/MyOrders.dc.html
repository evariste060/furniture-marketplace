<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My orders</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../tokens-and-components.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="ts" style="width: 100%; font-family: Inter, system-ui, sans-serif; color: #0F172A">
  <dc-import name="Header" active="None" cart="0" account="Aline" hint-size="100%,160px"></dc-import>
  <main class="bg-page">
    <div class="wrap row wrapx" style="align-items: flex-start; gap: 24px; padding-top: 32px; padding-bottom: 64px">
      <nav class="card p16 col" aria-label="Account" style="gap: 4px; flex: 1 1 240px; max-width: 260px">
        <div class="row" style="gap: 12px; padding: 8px 12px 16px"><span class="avatar" style="width: 44px; height: 44px; font-size: 15px">AM</span><span class="col" style="gap: 0"><b class="fw6">Aline Mukamana</b><span class="t-cap c-mut">+250 788 000 111</span></span></div>
        <a class="alink" href="Account.dc.html"><span class="ic ic-home i18" aria-hidden="true"></span>Overview</a>
        <a class="alink on" href="MyOrders.dc.html" aria-current="page"><span class="ic ic-package i18" aria-hidden="true"></span>My orders</a>
        <a class="alink" href="Addresses.dc.html"><span class="ic ic-pin i18" aria-hidden="true"></span>Addresses</a>
        <a class="alink" href="Profile.dc.html"><span class="ic ic-user i18" aria-hidden="true"></span>Profile &amp; security</a>
        <a class="alink" href="Main.dc.html" style="color: #DC2626"><span class="ic ic-logout i18" aria-hidden="true"></span>Log out</a>
      </nav>
      <div class="col" style="gap: 16px; flex: 999 1 560px; min-width: 0">
        <div class="row between wrapx" style="gap: 12px"><h1 class="t-h1" style="color: #0D2D52">My orders</h1><label class="row" style="gap: 8px; height: 40px; padding: 0 12px; border: 1px solid #E2E8F0; border-radius: 8px; background: #fff; width: 280px; color: #64748B"><span class="ic ic-search i16" aria-hidden="true"></span><input aria-label="Search orders" placeholder="Search by order number or product" style="border: 0; outline: 0; flex: 1; font-size: 13px"></label></div>
        <div class="tabs"><span class="tab on">All (7)</span><span class="tab">In progress (1)</span><span class="tab">Delivered (6)</span><span class="tab">Cancelled (0)</span></div>
        <sc-for list="{{orders}}" as="o" hint-placeholder-count="4">
          <article class="card p20 col" style="gap: 14px">
            <div class="row wrapx" style="gap: 12px"><b class="fw6">Order {{o.n}}</b><span class="badge {{o.sc}}">{{o.s}}</span><span class="grow"></span><span class="t-sm c-mut">{{o.d}}</span></div>
            <div class="row wrapx" style="gap: 16px">
              <span class="row" style="gap: 8px"><sc-for list="{{o.imgs}}" as="im" hint-placeholder-count="2"><span class="imgbox" style="width: 56px; height: 56px"><span class="dev {{im}}" aria-hidden="true" style="width: 46px; height: 46px"></span></span></sc-for></span>
              <span class="col grow" style="gap: 2px; min-width: 160px"><span class="t-sm c-mut">{{o.c}}</span><b class="fw6">{{o.t}}</b></span>
              <sc-if value="{{o.review}}" hint-placeholder-val="{{ false }}"><a class="btn btn-s btn-sm" href="WriteReview.dc.html"><span class="ic ic-star i14" aria-hidden="true"></span>Write a review</a></sc-if>
              <a class="btn btn-o btn-sm" href="OrderDetail.dc.html">View details<span class="ic ic-chev-r i14" aria-hidden="true"></span></a>
            </div>
          </article>
        </sc-for>
        <nav class="row" aria-label="Pagination" style="justify-content: center; gap: 8px; padding-top: 8px"><a class="btn btn-p btn-sm" href="MyOrders.dc.html" aria-current="page" style="width: 36px; padding: 0">1</a><a class="btn btn-n btn-sm" href="MyOrders.dc.html" style="width: 36px; padding: 0">2</a><a class="btn btn-n btn-sm" href="MyOrders.dc.html">Next<span class="ic ic-chev-r i14" aria-hidden="true"></span></a></nav>
      </div>
    </div>
  </main>
  <dc-import name="Footer" hint-size="100%,440px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    return { orders: [
      { n: '#3S-10482', s: 'Out for delivery', sc: 's-info', d: '24 Oct 2026', imgs: ['dev-ph-violet', 'dev-buds'], c: '2 items', t: 'RWF 713,000', review: false },
      { n: '#3S-09917', s: 'Delivered', sc: 's-ok', d: '2 Sep 2026', imgs: ['dev-laptop'], c: '1 item', t: 'RWF 820,000', review: true },
      { n: '#3S-09540', s: 'Delivered', sc: 's-ok', d: '18 Jul 2026', imgs: ['dev-mouse', 'dev-power'], c: '2 items', t: 'RWF 130,000', review: true },
      { n: '#3S-08876', s: 'Delivered', sc: 's-ok', d: '30 May 2026', imgs: ['dev-tv'], c: '1 item', t: 'RWF 520,000', review: false }
    ] };
  }
}
</script>
</body>
</html>
