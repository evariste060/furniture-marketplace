<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin — Products</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../tokens-and-components.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="ts adm" style="width: 100%; font-family: Inter, system-ui, sans-serif; color: #0F172A">
  <div class="adm-side" style="background: #071F42"><dc-import name="AdminSidebar" active="Products" hint-size="240px,1120px"></dc-import></div>
  <div class="adm-main">
    <dc-import name="AdminTopbar" hint-size="100%,68px"></dc-import>
    <main class="adm-body">
      <div class="row between wrapx" style="gap: 12px; align-items: flex-end">
        <div class="col" style="gap: 2px"><nav class="crumb" aria-label="Breadcrumb"><a href="Dashboard.dc.html" style="color: #64748B">Dashboard</a><span aria-hidden="true">/</span><b>Products</b></nav><h1 class="t-h1">Products</h1></div>
        <div class="row" style="gap: 10px"><a class="btn btn-n btn-sm" href="Import.dc.html"><span class="ic ic-upload i16" aria-hidden="true"></span>Import</a><a class="btn btn-p btn-sm" href="ProductEditor.dc.html"><span class="ic ic-plus i16" aria-hidden="true"></span>Add product</a></div>
      </div>
      <section class="card" style="overflow: hidden">
        <div class="row wrapx" style="gap: 12px; padding: 16px 20px; border-bottom: 1px solid #E2E8F0">
          <label class="row" style="gap: 8px; height: 38px; padding: 0 12px; border: 1px solid #E2E8F0; border-radius: 8px; flex: 1 1 240px; max-width: 340px; color: #64748B"><span class="ic ic-search i16" aria-hidden="true"></span><input aria-label="Search products" placeholder="Name, model or SKU" style="border: 0; outline: 0; flex: 1; font-size: 13px"></label>
          <select class="inp" aria-label="Category" style="width: 160px; height: 36px"><option>All categories</option></select>
          <select class="inp" aria-label="Brand" style="width: 140px; height: 36px"><option>All brands</option></select>
          <select class="inp" aria-label="Status" style="width: 140px; height: 36px"><option>All statuses</option><option>Published</option><option>Hidden</option><option>Draft</option></select>
          <label class="chk"><input type="checkbox">Low stock only</label>
        </div>
        <div class="scrollx"><table class="tbl">
          <thead><tr><th scope="col"><input type="checkbox" aria-label="Select all"></th><th scope="col">Product</th><th scope="col">Category</th><th scope="col">Brand</th><th scope="col">Price</th><th scope="col">Stock</th><th scope="col">Status</th><th scope="col">Visible</th><th scope="col"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Actions</span></th></tr></thead>
          <tbody>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
              <tr>
                <td><input type="checkbox" aria-label="Select {{r.n}}"></td>
                <td><span class="row" style="gap: 10px"><span class="imgbox" style="width: 44px; height: 44px"><span class="dev {{r.img}}" aria-hidden="true" style="width: 36px; height: 36px"></span></span><span class="col" style="gap: 0"><a href="ProductEditor.dc.html" class="fw5" style="color: #0F172A">{{r.n}}</a><span class="t-cap c-mut">{{r.sku}} · {{r.v}}</span></span></span></td>
                <td class="c-tx2">{{r.c}}</td><td class="c-tx2">{{r.b}}</td><td class="fw5" style="white-space: nowrap">{{r.p}}</td>
                <td><span class="row" style="gap: 6px; white-space: nowrap"><b class="fw5" style="color: {{r.qc}}">{{r.q}}</b><sc-if value="{{r.low}}" hint-placeholder-val="{{ false }}"><span class="badge s-err">Low</span></sc-if></span></td>
                <td><span class="badge {{r.sc}}">{{r.s}}</span></td>
                <td><span class="toggle {{r.tc}}" role="switch" aria-checked="{{r.on}}" aria-label="Show {{r.n}} on store"></span></td>
                <td><span class="row" style="gap: 4px"><a href="ProductEditor.dc.html" class="icbtn" aria-label="Edit {{r.n}}" style="width: 32px; height: 32px; border: 0"><span class="ic ic-edit i16" aria-hidden="true"></span></a><a href="Product.dc.html" class="icbtn" aria-label="View {{r.n}} on store" style="width: 32px; height: 32px; border: 0"><span class="ic ic-eye i16" aria-hidden="true"></span></a></span></td>
              </tr>
            </sc-for>
          </tbody>
        </table></div>
        <div class="row between wrapx t-sm c-tx2" style="gap: 12px; padding: 14px 20px; border-top: 1px solid #E2E8F0"><span>Showing 1–9 of 214 products</span><nav class="row" aria-label="Pagination" style="gap: 6px"><a class="btn btn-p btn-sm" href="Products.dc.html" aria-current="page" style="width: 36px; padding: 0">1</a><a class="btn btn-n btn-sm" href="Products.dc.html" style="width: 36px; padding: 0">2</a><a class="btn btn-n btn-sm" href="Products.dc.html" style="width: 36px; padding: 0">3</a><a class="btn btn-n btn-sm" href="Products.dc.html" aria-label="Next page" style="width: 36px; padding: 0"><span class="ic ic-chev-r i14" aria-hidden="true"></span></a></nav></div>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    const r = (n, sku, v, c, b, p, q, s, img, on) => ({ n, sku, v, c, b, p, q: String(q), low: q > 0 && q <= 6, qc: q === 0 ? '#DC2626' : q <= 6 ? '#B91C1C' : '#0F172A', s, sc: s === 'Published' ? 's-ok' : s === 'Hidden' ? 's-neu' : 's-warn', img, on: on ? 'true' : 'false', tc: on ? 'on' : '' });
    return { rows: [
      r('Samsung Galaxy A55 5G', 'SM-A556E', '3 variants', 'Phones', 'Samsung', 'RWF 520,000', 42, 'Published', 'dev-ph-violet', true),
      r('Apple iPhone 15', 'IPH15', '2 variants', 'Phones', 'Apple', 'RWF 1,450,000', 3, 'Published', 'dev-ph-pink', true),
      r('HP Pavilion 15 Laptop', 'HP-PAV15', '1 variant', 'Laptops', 'HP', 'RWF 820,000', 18, 'Published', 'dev-laptop', true),
      r('LG 43" Smart TV', 'LG43-SM', '1 variant', 'TVs & Audio', 'LG', 'RWF 520,000', 4, 'Published', 'dev-tv', true),
      r('JBL Flip 6 Bluetooth Speaker', 'JBL-FLIP6', '4 variants', 'Accessories', 'JBL', 'RWF 180,000', 0, 'Hidden', 'dev-speaker', false),
      r('Canon EOS 250D DSLR', 'CAN-250D', '1 variant', 'Cameras', 'Canon', 'RWF 950,000', 9, 'Published', 'dev-camera', true),
      r('Samsung Galaxy Watch 6', 'SM-R940', '2 variants', 'Wearables', 'Samsung', 'RWF 480,000', 14, 'Published', 'dev-watch', true),
      r('TP-Link Archer C6 Router', 'TPL-C6', '1 variant', 'Networking', 'TP-Link', 'RWF 65,000', 3, 'Published', 'dev-router', true),
      r('Sony WH-1000XM5', 'SONY-XM5', '2 variants', 'Accessories', 'Sony', 'RWF 620,000', 11, 'Draft', 'dev-head', false)
    ] };
  }
}
</script>
</body>
</html>
