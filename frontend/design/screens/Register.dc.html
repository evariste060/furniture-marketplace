<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create account</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../tokens-and-components.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="ts" style="width: 100%; font-family: Inter, system-ui, sans-serif; color: #0F172A">
  <dc-import name="Header" active="None" cart="2" hint-size="100%,160px"></dc-import>
  <main class="bg-page">
    <div class="wrap" style="padding-top: 48px; padding-bottom: 64px">
      <form class="card p32 col sh" style="max-width: 520px; margin: 0 auto; gap: 18px">
        <div class="col" style="gap: 4px"><h1 class="t-h2">Create your account</h1><p class="c-tx2 t-sm">Already have one? <a href="Login.dc.html" class="fw5">Sign in</a></p></div>
        <div class="g g2" style="gap: 16px">
          <div class="field"><label class="lbl" for="fn">First name</label><input id="fn" class="inp" defaultValue="Aline"></div>
          <div class="field"><label class="lbl" for="ln">Last name</label><input id="ln" class="inp" defaultValue="Mukamana"></div>
        </div>
        <div class="field"><label class="lbl" for="ph">Phone number</label><div class="prefix"><span>+250</span><input id="ph" defaultValue="788 000 111"></div></div>
        <div class="field"><label class="lbl" for="em">Email <span class="c-mut" style="font-weight: 400">(optional)</span></label><input id="em" class="inp err" defaultValue="aline@example"><span class="help err">Enter a valid email address, like name@example.com</span></div>
        <div class="field"><label class="lbl" for="pw">Password</label><input id="pw" type="password" class="inp" defaultValue="Kigali2026"><div class="row" style="gap: 4px"><span class="track grow" style="height: 4px"><span style="width: 100%; background: #16A34A"></span></span><span class="track grow" style="height: 4px"><span style="width: 100%; background: #16A34A"></span></span><span class="track grow" style="height: 4px"><span style="width: 100%; background: #16A34A"></span></span><span class="track grow" style="height: 4px"><span style="width: 0%"></span></span></div><span class="help">Strong · at least 8 characters with a number</span></div>
        <div class="field"><label class="lbl" for="lg">Preferred language</label><select id="lg" class="inp"><option>English</option><option>Kinyarwanda</option></select></div>
        <label class="chk" style="align-items: flex-start"><input type="checkbox" defaultChecked="{{ true }}" style="margin-top: 2px"><span class="t-sm c-tx2">I agree to the <a href="Policy.dc.html">Terms</a> and <a href="Policy.dc.html">Privacy Policy</a></span></label>
        <label class="chk"><input type="checkbox">Send me deals by SMS (you can stop anytime)</label>
        <a class="btn btn-p btn-lg btn-block" href="Account.dc.html">Create account</a>
        <p class="t-cap c-mut" style="text-align: center">You’ll be signed in and returned to where you were.</p>
      </form>
    </div>
  </main>
  <dc-import name="Footer" hint-size="100%,440px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1350}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
