# Lets `py -m mypy` and `py -m mypy .` run from the repository root.
# Mirrors [tool.mypy] in backend/pyproject.toml, which mypy uses when run from backend/.
[mypy]
python_version = 3.12
files = backend/app, backend/tests
mypy_path = $MYPY_CONFIG_FILE_DIR/backend
explicit_package_bases = True
exclude = (^|/)(\.venv|node_modules|pytest-cache-files-[^/]*)/
show_error_codes = True
warn_unused_configs = True

# openpyxl ships no type information (module 8); its calls are covered by tests.
[mypy-openpyxl.*]
ignore_missing_imports = True

# reportlab ships no type information (module 16); its calls are covered by tests.
[mypy-reportlab.*]
ignore_missing_imports = True
